name: kimai
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: kimai/kimai2:latest
    container_name: kimai-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: kimai-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      APP_ENV: prod
      TRUSTED_HOSTS: ${BASE_HOST_NAME:-$HOSTNAME}
      ADMINMAIL: ${APP_ADMIN_USER:-admin}@${BASE_DOMAIN_NAME:-example.com}
      ADMINPASS: ${APP_ADMIN_PASS:-replace-with-a-random-password}
      DATABASE_URL: mysql://${DB_USER_NAME:-kimai}:${DB_USER_PASS:-replace-with-a-random-password}@kimai-db:3306/${DB_CREATE_DATABASE_NAME:-kimai}?charset=utf8mb4&serverVersion=mariadb-11.4.0
      MAILER_FROM: ${EMAIL_SERVER_MAIL_FROM:-no-reply@example.com}
      MAILER_URL: smtp://${EMAIL_SERVER_HOST:-172.17.0.1}:${EMAIL_SERVER_PORT:-587}
    volumes:
      - './volumes/data/kimai:/opt/kimai/var/data:z'
      - './volumes/config/kimai:/opt/kimai/config/packages/local:z'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8001']
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://kimai-app:8001'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - kimai
      - cloudflare

  db:
    image: mariadb:latest
    container_name: kimai-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: kimai-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: kimai-db
      MARIADB_DATABASE: ${DB_CREATE_DATABASE_NAME:-kimai}
      MARIADB_USER: ${DB_USER_NAME:-kimai}
      MARIADB_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
      MARIADB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-replace-with-a-random-password}
    volumes:
      - './volumes/db/mariadb/kimai:/var/lib/mysql:z'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kimai

networks:
  kimai:
    name: kimai
    external: false
  cloudflare:
    external: true
